# Not currently used (no Docker Desktop in this environment) - written for future local/
# CI use. From `backend/`: `docker compose up --build`.
#
# The api service's real configuration - AI/Finnhub/broker keys, the Jwt secret - still
# comes from appsettings.json/appsettings.Production.json or environment variables you
# supply; nothing secret is baked into this file. DB_PASSWORD/JWT_SECRET below are meant
# to be provided via a local .env file (gitignored) or the shell environment, not
# hardcoded here.
services:
  api:
    build:
      context: .
      dockerfile: src/StockTrader.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=StockTraderDb;User Id=sa;Password=${DB_PASSWORD:?set DB_PASSWORD};TrustServerCertificate=True;"
      Jwt__Secret: ${JWT_SECRET:?set JWT_SECRET}
    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sqlserver-data:
